<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Break the band — setting up (recorded screenshots)</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#111315;--panel:#171a1d;--line:#2b3035;--text:#ebe8e2;--muted:#a6abaf;--inj:#f2b544}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:26px;margin:0;letter-spacing:-.01em}
.tag{border:1px solid var(--inj);color:var(--inj);border-radius:4px;padding:3px 8px;font-size:12px;font-weight:800;letter-spacing:.07em}
.st{color:var(--muted);margin-left:auto}
main{max-width:1500px;margin:0 auto;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:20px}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
img{display:block;width:100%;height:auto;border-bottom:1px solid var(--line)}
figcaption{padding:10px 14px;color:var(--muted)}
figcaption b{color:var(--text)}
</style>
</head>
<body>
<header>
  <h1>Break the band</h1>
  <span class="tag">RECORDED SCREENSHOTS · NOT LIVE</span>
  <span class="st" id="st">One-time setup is running (about 2 minutes on a fresh clone). This page switches to the live demo by itself.</span>
</header>
<main>
  <figure><img src="../fallback/01-landing.png" alt=""><figcaption><b>Selected day, no injection.</b> D · 2016-03-28, 1 of 327 flippable stock-days (2.0%).</figcaption></figure>
  <figure><img src="../fallback/02-plain-broken.png" alt=""><figcaption><b>One fake post breaks plain CQR</b>; the certified band is guaranteed to contain the no-injection interval.</figcaption></figure>
  <figure><img src="../fallback/03-beyond-budget.png" alt=""><figcaption><b>6 posts against k = 3:</b> the badge turns grey, no guarantee.</figcaption></figure>
  <figure><img src="../fallback/04-why-and-flips.png" alt=""><figcaption><b>Why it can't break:</b> the deletion box, and the tested attacks that flip this day.</figcaption></figure>
  <figure><img src="../fallback/05-redteam.png" alt=""><figcaption><b>2,000 random attacks:</b> 0 certified containment violations within budget.</figcaption></figure>
  <figure><img src="../fallback/06-population.png" alt=""><figcaption><b>Replay on all 16,443 stock-days:</b> live numbers equal the committed results.</figcaption></figure>
  <figure><img src="../fallback/07-aci-meter.png" alt=""><figcaption><b>Rolling ACI coverage</b>, recomputed live: 89.50% = committed.</figcaption></figure>
  <figure><img src="../fallback/08-silent-stock.png" alt=""><figcaption><b>A silent stock</b> (0 real posts): one fake post is the whole signal.</figcaption></figure>
</main>
<script>
// same origin: this static server answers 404 for /api/health; the live server answers with engine_ready
(async function poll(){
  for(;;){
    try{
      const r = await fetch("/api/health", {cache:"no-store"});
      if(r.ok){ const h = await r.json(); if(h.engine_ready){ location.replace("/"); return; } document.getElementById("st").textContent = "Live engine loading…"; }
    }catch(e){}
    await new Promise(r => setTimeout(r, 1000));
  }
})();
</script>
</body>
</html>
