[project]
name = "p06-stat-arb"
version = "0.1.0"
description = "Perceptron 2026 P6 — cross-asset statistical arbitrage with latency budgets"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=15",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "lifelines>=0.29",
  "scikit-learn>=1.4",
  "numba>=0.60",
  "pydantic>=2.6",
  "websockets>=12",
  "aiohttp>=3.9",
  "orjson>=3.9",
  "matplotlib>=3.8",
  "pytest>=8",
  "tabulate>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["components", "eval"]
