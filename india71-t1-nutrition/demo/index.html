<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poshan Setu: live demo (India@71 · Theme 1)</title>
<style>
:root {
  --ink: #13213c; --ink-2: #33415c; --muted: #4a566b; --rule: #d5dbe4; --panel: #f2f4f7; --paper: #ffffff;
  --ours: #0a6c8f; --ours-soft: #d7ecf4; --base: #6f7888; --pooled: #6c4fa3;
  --green: #1b7443; --turmeric: #e3a008; --turmeric-soft: #fbeec8; --red: #b9261a; --red-soft: #f8dcd8;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, "Noto Sans Devanagari", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --top-h: 2.75rem;
}
* { box-sizing: border-box; }
html { font-size: clamp(13px, 0.62vw + 6.5px, 20px); }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); line-height: 1.35; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.mono, code, kbd { font-family: var(--mono); }
kbd { font-size: .8em; border: 1px solid var(--rule); border-radius: 4px; padding: 0 .3em; margin-left: .3em; background: var(--panel); }
p { margin: 0; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; height: var(--top-h); display: flex; align-items: center; gap: 1.2rem; padding: 0 1.4rem; background: var(--paper); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; white-space: nowrap; }
.steps { display: flex; gap: .3rem; margin-left: auto; }
.steps button { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: .2rem .62rem; font-size: .8rem; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.steps button:hover { border-color: var(--ink-2); }
.steps button[aria-current="step"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.steps button .tag { font-size: .66rem; letter-spacing: .06em; margin-left: .3rem; opacity: .9; }
.keys { color: var(--muted); font-size: max(12px, .78rem); white-space: nowrap; }

/* slides: each screen fills the viewport below the top bar; nothing below the fold */
main { height: calc(100vh - var(--top-h)); }
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; gap: .5rem; height: 100%; padding: .55rem 1.4rem .5rem; animation: enter .28s cubic-bezier(.16,1,.3,1); }
@keyframes enter { from { opacity: .35; } to { opacity: 1; } }
.head { display: flex; align-items: flex-start; gap: 1.2rem; flex: none; }
.head h1 { margin: 0; font-size: 1.6rem; line-height: 1.15; letter-spacing: -0.015em; text-wrap: balance; }
.head p.lede { margin-top: .25rem; color: var(--ink-2); font-size: .98rem; max-width: 105ch; }
.head .stampwrap { margin-left: auto; padding-top: .15rem; }
.stamp { display: inline-block; border: 2px solid currentColor; outline: 1px solid currentColor; outline-offset: 2px; padding: .18rem .55rem; font-weight: 800; font-size: max(12px, .76rem); letter-spacing: .12em; text-transform: uppercase; transform: rotate(-2deg); white-space: nowrap; }
.stamp.real { color: var(--green); }
.stamp.synth { color: #7a4f00; }
.stamp.sim { color: var(--ours); }
.body { flex: 1; min-height: 0; display: grid; gap: .8rem 1.1rem; }
.foot { flex: none; display: flex; align-items: flex-end; gap: 1rem; }
.foot .foot-text { flex: 1; display: grid; gap: .3rem; min-width: 0; }
.caveat { padding: .32rem .7rem; background: var(--turmeric-soft); border-radius: 7px; font-size: .9rem; }
.caveat b { font-weight: 700; }
.src { color: var(--muted); font-size: max(13px, .9rem); line-height: 1.3; }
.src code { font-size: .92em; color: var(--ink-2); }
.details-btn { flex: none; }

.banner { flex: none; display: flex; align-items: center; gap: .3rem 1rem; padding: .3rem .8rem; background: var(--ours-soft); border-radius: 8px; font-size: .86rem; white-space: nowrap; overflow: hidden; }
.banner b.big { font-size: .9rem; letter-spacing: .02em; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--paper); flex: none; }
.seg button { border: 0; background: transparent; padding: .26rem .6rem; cursor: pointer; font-size: .86rem; color: var(--ink-2); border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--panel); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.seg button .star { color: #b07800; margin-left: .12rem; }
.seg button[aria-pressed="true"] .star { color: #ffd665; }
.btn { border: 1px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 8px; padding: .3rem .75rem; cursor: pointer; font-weight: 600; font-size: .88rem; }
.btn:hover { background: var(--panel); }
.btn.primary { background: var(--ink); color: #fff; }
.btn.primary:hover { background: #24375e; }
.btn[aria-pressed="true"] { background: var(--ink); color: #fff; }
:focus-visible { outline: 3px solid var(--turmeric); outline-offset: 2px; }

.panel { background: var(--panel); border-radius: 10px; padding: .6rem .85rem; min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: .4rem; }
.panel h2 { margin: 0; font-size: 1rem; letter-spacing: -0.005em; }
.panel h3 { margin: 0; font-size: .92rem; }
.prow { display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; }
.fill { flex: 1; min-height: 0; position: relative; }
.fill > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.note { color: var(--ink-2); font-size: .9rem; }
.verdict { font-size: .98rem; }
.verdict b { font-size: 1.04rem; }
.label { color: var(--muted); font-size: max(12px, .82rem); }
.row { display: flex; align-items: center; gap: .4rem .8rem; flex-wrap: wrap; }
svg text { font-family: var(--font); }
svg text.halo { stroke: #ffffff; stroke-width: 4px; paint-order: stroke; stroke-linejoin: round; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: #fff; padding: .35rem .55rem; border-radius: 6px; font-size: .82rem; max-width: 22rem; box-shadow: 0 4px 12px rgba(0,0,0,.2); display: none; }
.dot { display: inline-block; width: .75rem; height: .75rem; border-radius: 50%; flex: none; vertical-align: -1px; }

/* details drawer */
.drawer { position: fixed; z-index: 40; top: var(--top-h); right: 0; bottom: 0; width: min(46rem, 56vw); background: var(--paper); border-left: 1px solid var(--rule); box-shadow: -8px 0 24px rgba(0,0,0,.14); overflow: auto; padding: .9rem 1.2rem 1.4rem; }
.drawer[hidden] { display: none; }
.drawer .dhead { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: .6rem; }
.drawer h2 { margin: 0; font-size: 1.1rem; }
.drawer h3 { margin: .9rem 0 .3rem; font-size: .98rem; }
.drawer p, .drawer li { font-size: .92rem; color: var(--ink-2); margin: .25rem 0; }
.drawer ul { margin: .2rem 0; padding-left: 1.2rem; }
.drawer table { border-collapse: collapse; font-size: .86rem; width: 100%; }
.drawer td, .drawer th { border-bottom: 1px solid var(--rule); padding: .18rem .35rem; text-align: left; }
.drawer th { color: var(--muted); font-weight: 600; }

/* screen 1-2 */
.g-india { grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr); }
.g-dist { grid-template-columns: minmax(0, 2.05fr) minmax(0, 1fr); }
.kpi { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; }
.kpi div { background: var(--paper); border-radius: 8px; padding: .45rem .6rem; }
.kpi .v { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; }
.kpi .k { color: var(--muted); font-size: max(12px, .8rem); }

/* screen 3 */
.g-link { grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); }
.knob .label { display: block; margin-bottom: .2rem; color: var(--ink-2); }
.bars { display: grid; gap: .45rem; }
.bar { display: grid; grid-template-columns: 11.6rem minmax(0, 1fr) 3.4rem; align-items: center; column-gap: .6rem; }
.bar .name { font-weight: 700; font-size: .9rem; line-height: 1.12; }
.bar .name small { display: block; font-weight: 400; color: var(--muted); font-size: max(12px, .76rem); }
.bar .track { position: relative; height: 1.45rem; background: var(--paper); border-radius: 5px; overflow: hidden; }
.bar .fillbar { position: absolute; inset: 0; border-radius: 5px; transform-origin: left center; transition: transform .45s cubic-bezier(.16,1,.3,1); }
.bar .val { font-size: 1.35rem; font-weight: 800; text-align: right; letter-spacing: -0.02em; }
.bar .sub { grid-column: 2 / 4; font-size: max(12px, .8rem); color: var(--ink-2); }
.bar .sub .bad { color: var(--red); font-weight: 700; }
.bar .sub .good { color: var(--green); font-weight: 700; }
.bar.matched .name { font-weight: 600; }
.callout { background: var(--paper); border-radius: 8px; padding: .4rem .6rem; font-size: .9rem; }
.boundary { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem .7rem; }
.dept { background: var(--paper); border-radius: 8px; padding: .4rem .55rem; font-size: max(12px, .8rem); min-width: 0; }
.dept .sys { font-weight: 700; font-size: .86rem; }
.dept .stay { color: var(--muted); font-size: max(12px, .74rem); }
.dept dl { display: grid; grid-template-columns: auto 1fr; gap: 0 .45rem; margin: .15rem 0 0; }
.dept dt { color: var(--muted); }
.dept dd { margin: 0; font-family: var(--mono); font-size: max(12px, .76rem); overflow-wrap: anywhere; }
.crossing { grid-column: 1 / 3; text-align: center; font-size: max(12px, .8rem); color: var(--ink-2); }
.bitbox { min-width: 0; }
.bitbox svg { display: block; width: 100%; height: auto; }
.bitbox .cap { font-size: max(12px, .74rem); color: var(--muted); margin-top: .1rem; }
.tokens { font-family: var(--mono); font-size: max(12px, .72rem); color: var(--ink-2); overflow-wrap: anywhere; }

/* screen 4 */
.g-child { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.meet { display: grid; gap: .45rem; align-content: start; }
.vrow { display: flex; align-items: flex-start; gap: .5rem; background: var(--paper); border-radius: 8px; padding: .38rem .55rem; font-size: .9rem; }
.vrow .dot { margin-top: .25rem; }

/* screen 5 */
.g-week { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
.lists { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; min-height: 0; }
.list h3 { margin: 0 0 .25rem; font-size: .9rem; line-height: 1.2; }
.list ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.list li { display: grid; grid-template-columns: 1.7rem minmax(0, 1fr) 2.9rem 2.6rem 4.6rem; align-items: center; gap: .35rem; padding: .1rem .35rem; border-radius: 5px; font-size: .84rem; background: var(--paper); white-space: nowrap; }
.list li.lh { background: transparent; color: var(--muted); font-size: max(12px, .76rem); font-weight: 600; padding-top: 0; padding-bottom: 0; }
.list li .num { text-align: right; }
.list li.slot { background: var(--ours-soft); font-weight: 600; }
.list.base li.slot { background: #e3e6eb; }
.list li .r { color: var(--muted); font-size: max(12px, .76rem); text-align: right; }
.list li .ref { font-family: var(--mono); font-size: .8rem; }
.list li .ev { font-size: max(12px, .76rem); font-weight: 700; color: var(--red); text-align: right; white-space: nowrap; }
.list li.lh .ev { color: var(--muted); font-weight: 600; }
.list li.featured .ref { text-decoration: underline 2px var(--turmeric); text-underline-offset: 3px; }
.list li.cut { background: transparent; padding: 0; height: 0; border-top: 2px dashed var(--ink-2); margin: 2px 0; }
.tally { font-size: .86rem; margin-top: .2rem; }
.pill { display: inline-block; border-radius: 999px; padding: 0 .42rem; font-size: max(12px, .72rem); font-weight: 700; }
.pill.sam { background: var(--red); color: #fff; }
.pill.mam { background: var(--turmeric); color: var(--ink); }
.pill.risk_high { background: var(--ours); color: #fff; }
.pill.nogain { background: #e3e6eb; color: var(--ink); }

/* screen 6 */
.g-sms { grid-template-columns: minmax(0, .78fr) minmax(0, 1.22fr); }
.phone { width: min(100%, 20rem); height: 100%; margin: 0 auto; background: #1c2333; border-radius: 1.9rem; padding: .8rem .65rem; box-shadow: 0 14px 28px rgba(0,0,0,.22), 0 2px 5px rgba(0,0,0,.18); display: flex; flex-direction: column; min-height: 0; }
.phone .screenp { background: #f7f8fa; border-radius: 1.2rem; padding: .55rem .5rem; overflow: auto; flex: 1; min-height: 0; }
.phone .who { text-align: center; font-size: max(12px, .76rem); color: var(--muted); margin-bottom: .4rem; }
.sms { background: #fff; border-radius: 12px 12px 12px 4px; padding: .36rem .5rem; margin: 0 1rem .34rem 0; font-family: var(--mono); font-size: max(12px, .74rem); line-height: 1.3; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.sms .c { display: block; text-align: right; color: var(--muted); font-family: var(--font); font-size: max(11px, .66rem); }
.queue table { width: 100%; border-collapse: collapse; font-size: .84rem; }
.queue td, .queue th { padding: .1rem .3rem; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
.queue th { color: var(--muted); font-weight: 600; font-size: max(12px, .78rem); }
.queue tr.feat td { background: var(--turmeric-soft); font-weight: 700; }
.notice { background: var(--paper); border: 1.5px dashed var(--ours); border-radius: 8px; padding: .3rem .6rem; font-size: .88rem; }

/* screen 7 */
.g-break { grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr); }
.modes { flex: none; display: flex; gap: .4rem; flex-wrap: wrap; }
.mode { border-radius: 999px; padding: .1rem .6rem; font-size: max(12px, .8rem); font-weight: 700; border: 1.5px solid; }
.mode.rec { color: var(--muted); border-color: var(--muted); }
.mode.live { color: var(--green); border-color: var(--green); }
.mode.simx { color: #7a4f00; border-color: #b07800; }
.reqs { display: grid; gap: .3rem; }
.req { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .5rem; text-align: left; border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: .28rem .6rem; cursor: pointer; font-size: .88rem; }
.req:hover { border-color: var(--ink-2); }
.req[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.req small { display: block; color: var(--muted); font-size: max(12px, .74rem); }
.mini { font-size: max(11px, .7rem); font-weight: 800; letter-spacing: .08em; padding: .08rem .36rem; border-radius: 4px; }
.mini.allow { color: var(--green); border: 1.5px solid var(--green); }
.mini.deny { color: var(--red); border: 1.5px solid var(--red); }
.decision { position: relative; background: var(--paper); border-radius: 10px; padding: .5rem .75rem; font-size: .86rem; flex: 1; min-height: 0; overflow: hidden; }
.decision .bigstamp { position: absolute; right: .8rem; top: .55rem; font-size: 1.3rem; font-weight: 900; letter-spacing: .14em; border: 3px solid currentColor; outline: 1.5px solid currentColor; outline-offset: 3px; padding: .1rem .5rem; transform: rotate(-6deg); }
.decision .bigstamp.allow { color: var(--green); }
.decision .bigstamp.deny { color: var(--red); }
.decision .bigstamp.press { animation: press .32s cubic-bezier(.16,1,.3,1); }
@keyframes press { from { transform: rotate(-12deg) scale(1.6); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }
.decision dl { display: grid; grid-template-columns: auto 1fr; gap: .1rem .6rem; margin: 0; max-width: calc(100% - 8.5rem); }
.decision dt { color: var(--muted); }
.decision dd { margin: 0; }
.tamper { display: flex; flex-wrap: wrap; gap: .3rem; }
.tamper .btn { font-weight: 500; font-size: .82rem; padding: .24rem .55rem; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.check { border-radius: 8px; padding: .35rem .6rem; font-size: .86rem; background: var(--paper); }
.check b { display: block; font-size: 1.02rem; }
.check.ok b { color: var(--green); }
.check.bad b { color: var(--red); }
.ledger { flex: 1; min-height: 0; overflow: auto; background: var(--paper); border-radius: 8px; }
.ledger table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .8rem; }
.ledger th, .ledger td { padding: .14rem .4rem; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
.ledger thead th { position: sticky; top: 0; z-index: 2; background: var(--paper); color: var(--muted); font-weight: 600; box-shadow: 0 1px 0 var(--rule); }
.ledger td.h { font-family: var(--mono); font-size: max(11px, .74rem); }
.ledger tr.bad td { background: var(--red-soft); }
.ledger tr.changed td { font-weight: 700; }

@media (max-width: 1100px) {
  main { height: auto; }
  .screen.active { height: auto; }
  .body, .g-india, .g-dist, .g-link, .g-child, .g-week, .g-sms, .g-break { display: grid; grid-template-columns: minmax(0, 1fr); }
  .fill { height: 62vw; flex: none; }
  .topbar { height: auto; flex-wrap: wrap; padding: .4rem .8rem; }
  .steps { margin-left: 0; flex-wrap: wrap; }
  .banner { white-space: normal; flex-wrap: wrap; }
  .phone { height: 30rem; }
  .ledger { max-height: 20rem; }
  .drawer { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Poshan Setu</div>
  <nav class="steps" id="steps" aria-label="Demo screens"></nav>
  <div class="keys">← → 1–7 · d details</div>
</header>
<main id="main">
  <section class="screen" id="s-india" aria-label="India, state by state"></section>
  <section class="screen" id="s-districts" aria-label="District by district"></section>
  <section class="screen" id="s-find" aria-label="Find every child"></section>
  <section class="screen" id="s-child" aria-label="One child"></section>
  <section class="screen" id="s-week" aria-label="This month's slots"></section>
  <section class="screen" id="s-sms" aria-label="The worker's SMS"></section>
  <section class="screen" id="s-break" aria-label="Try to break it"></section>
</main>
<aside class="drawer" id="details" hidden aria-label="Details">
  <div class="dhead"><h2 id="det-title">Details</h2><button class="btn" id="det-close">Close <kbd>Esc</kbd></button></div>
  <div id="det-body"></div>
</aside>
<div class="tip" id="tip" role="status"></div>
<noscript><p style="padding:2rem">This demo needs JavaScript (no network access is used).</p></noscript>
<script src="data/demo_data.js"></script>
<script src="js/ledger.js"></script>
<script src="js/core.js"></script>
<script src="js/real.js"></script>
<script src="js/find.js"></script>
<script src="js/child.js"></script>
<script src="js/week.js"></script>
<script src="js/break.js"></script>
<script src="js/main.js"></script>
</body>
</html>
