<!doctype html><html lang="en"><head><meta charset="utf-8"><title>EV Infra Map India — decision dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
 html,body{margin:0;height:100%;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1d2433;background:#f3f5f8}
 #map{position:absolute;inset:0 360px 0 0;background:#eef1f5} #side{position:absolute;top:0;right:0;width:360px;bottom:0;overflow:auto;padding:14px 18px;box-sizing:border-box;border-left:1px solid #dde2ea;background:#fbfcfd}
 h1{font-size:17px;margin:0} .tabs{display:flex;gap:6px;margin:8px 0 10px} .tabs a{padding:4px 10px;border-radius:14px;border:1px solid #cfd6e0;color:#334155;text-decoration:none;font-size:13px}
 .tabs a.on{background:#1d2433;color:#fff;border-color:#1d2433} .sub{color:#5b6475;font-size:12.5px;margin:4px 0 10px} h2{font-size:13.5px;margin:14px 0 6px}
 .legend div{display:flex;align-items:center;gap:8px;font-size:12px;margin:2px 0} .sw{width:18px;height:12px;border-radius:2px;display:inline-block}
 label{display:block;font-size:13px;margin:3px 0;cursor:pointer} table{border-collapse:collapse;width:100%;font-size:12px} td{padding:3px 4px;border-bottom:1px solid #edf0f4;vertical-align:top}
 td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap} tr.click{cursor:pointer} tr.click:hover{background:#eef4ff}
 .note{font-size:11.2px;color:#5b6475;margin-top:14px;border-top:1px solid #e3e6ec;padding-top:10px} .kpi{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
 .kpi div{background:#fff;border:1px solid #e3e7ee;border-radius:8px;padding:6px 8px} .kpi b{display:block;font-size:15px} .kpi span{font-size:11px;color:#5b6475}
 #tip{position:absolute;pointer-events:none;background:#1d2433;color:#fff;font-size:12px;padding:3px 7px;border-radius:4px;display:none;z-index:5}
 .maplibregl-popup-content{font-size:12px;max-width:300px;line-height:1.4}
</style></head><body><div id="map"></div><div id="tip"></div><div id="side">
<h1>EV Infra Map India</h1>
<div class="tabs"><a id="tabN" href="index.html">India · states</a><a id="tabM" href="maharashtra.html">Maharashtra · districts</a></div>
<div class="sub" id="subtitle"></div><div class="kpi" id="kpi"></div>
<h2>Map layer</h2><div id="layers"></div><div class="legend" id="legend"></div>
<label><input type="checkbox" id="tSites" checked> Charging sites in open data <span class="sw" style="background:#0f766e;border-radius:50%;width:9px;height:9px"></span> 2–3 sources <span class="sw" style="background:#94a3b8;border-radius:50%;width:9px;height:9px"></span> 1 source</label>
<h2 id="rankTitle"></h2><table id="rank"></table>
<div class="note" id="note"></div></div>
<script>
const MODE="__MODE__", AREAS=__AREAS__, SITES=__SITES__, META=__META__;
const fmt=(n,d=0)=>n==null||Number.isNaN(n)?'—':Number(n).toLocaleString('en-IN',{maximumFractionDigits:d});
const C=['#e9f4ef','#bfe0d0','#f6d58e','#f2a65a','#e0683c','#b3261e'], CC=['#b3261e','#e0683c','#f2a65a','#f6d58e','#bfe0d0','#5aa78a'];
let LAYERS;
if(MODE==='national'){
 document.getElementById('tabN').classList.add('on');
 document.getElementById('subtitle').textContent='Battery-electric vehicles (VAHAN) against official public charging stations, and how much of the official count open data can see.';
 LAYERS=[{id:'bev_per_pcs',name:'BEV registrations per official station',breaks:[150,300,450,700,1000],colors:C,unit:'BEV / station'},
         {id:'coverage_pct',name:'Open-data coverage of the official count (%)',breaks:[2,5,10,25,50],colors:CC,unit:'% visible'}];
 const tot=AREAS.features.reduce((a,f)=>{const p=f.properties;a.b+=p.bev_cum||0;a.s+=p.pcs_total||0;a.o+=p.n_obs||0;return a},{b:0,s:0,o:0});
 document.getElementById('kpi').innerHTML=`<div><b>${fmt(tot.b)}</b><span>BEV registered (VAHAN, to 4 Oct 2026)</span></div><div><b>${fmt(tot.s)}</b><span>official public stations (1 Aug 2025)</span></div>
  <div><b>${fmt(tot.b/tot.s)}</b><span>BEV per official station</span></div><div><b>${fmt(100*tot.o/tot.s,1)}%</b><span>of official count visible in open data (${fmt(tot.o)} sites)</span></div>
  <div><b>${fmt(META.c9.nowcast_2026_national)}</b><span>BEV registrations nowcast, CY2026 (CY2025: ${fmt(META.c9.actual_2025)})</span></div>
  <div><b>${fmt(META.mse.national_mse.N_hat)}</b><span>capture–recapture estimate of sites (90% CI ${fmt(META.mse.national_mse.ci90_lo)}–${fmt(META.mse.national_mse.ci90_hi)}); failed state validation</span></div>`;
 document.getElementById('rankTitle').textContent='Most underserved states (BEV per official station, states > 50,000 BEV)';
 const rk=AREAS.features.map(f=>f.properties).filter(p=>p.bev_per_pcs!=null&&p.bev_cum>50000).sort((a,b)=>b.bev_per_pcs-a.bev_per_pcs).slice(0,12);
 document.getElementById('rank').innerHTML='<tr><td><b>State</b></td><td class="n"><b>BEV/stn</b></td><td class="n"><b>Stations</b></td><td class="n"><b>Open %</b></td></tr>'+rk.map(p=>`<tr><td>${p.shapeName}</td><td class="n">${fmt(p.bev_per_pcs)}</td><td class="n">${fmt(p.pcs_total)}</td><td class="n">${fmt(p.coverage_pct,1)}</td></tr>`).join('');
 document.getElementById('note').innerHTML=`<b>Sources</b> · BEV = VAHAN 4 dashboard, fuels ELECTRIC(BOV)+PURE EV, "Till Today", fetched 4 Oct 2026 · Official stations = PIB release 2151390 (MoP inputs, 1 Aug 2025) · Open data = OpenStreetMap (Overpass, 4 Oct 2026, ODbL) ∪ Open Charge Map export (22 Apr 2026) ∪ Overture Maps places 2026-09-23.1 (CDLA-P-2.0/Apache-2.0/CC0), linked within 150 m · Nowcast = Jan–Sep 2026 VAHAN × YoY scaling (backtest 2023–25: state WAPE 7.2%).<br><br><b>Read with care</b> · Registrations are not on-road stock; official stations predate registrations by 14 months (IEEFA reports 52,718 stations by Jul 2026); the ratio ignores the segment mix (e-2W/3W mostly charge at home, depots or swap).<br><br><b>Boundaries</b> · geoBoundaries IND ADM1 (DataMeet/ECI, CC BY 2.5 IN), simplified. No third-party basemap is drawn. Not a Survey of India–certified map.`;
} else {
 document.getElementById('tabM').classList.add('on');
 document.getElementById('subtitle').textContent='Representative geography: where Maharashtra\u2019s public charging is thinnest relative to its EVs — with uncertainty and reasons.';
 LAYERS=[{id:'bev_per_station',name:'BEV registrations per estimated station',breaks:[150,200,250,300,400],colors:C,unit:'BEV / station'},
         {id:'open_coverage_pct',name:'Open-data coverage of estimated stations (%) — data thinness',breaks:[0.1,5,10,25,50],colors:CC,unit:'% visible'}];
 AREAS.features.forEach(f=>{f.properties.open_coverage_pct=f.properties.open_coverage==null?null:100*f.properties.open_coverage});
 const s=META;
 document.getElementById('kpi').innerHTML=`<div><b>${fmt(s.official_mh_stations_aug2025)}</b><span>official public stations, Maharashtra (1 Aug 2025)</span></div><div><b>${fmt(s.mh_bev_per_station_avg)}</b><span>BEV per station, state average</span></div>
  <div><b>${fmt(s.open_sites_in_mh)}</b><span>sites visible in open data (${s.districts_with_zero_open_sites} of ${s.districts} districts have none)</span></div><div><b>+${fmt(s.mh_shortfall_vs_karnataka)}</b><span>stations to reach Karnataka\u2019s density (${s.karnataka_bev_per_station} BEV/stn)</span></div>`;
 document.getElementById('rankTitle').textContent='Districts ranked by BEV per estimated station (90% range)';
 const rk=AREAS.features.map(f=>f.properties).sort((a,b)=>b.bev_per_station-a.bev_per_station);
 document.getElementById('rank').innerHTML='<tr><td><b>District</b></td><td class="n"><b>BEV/stn</b></td><td class="n"><b>range</b></td><td class="n"><b>+stn*</b></td></tr>'+rk.map(p=>`<tr class="click" data-d="${p.district}"><td>${p.district}</td><td class="n">${fmt(p.bev_per_station)}</td><td class="n">${p.bev_per_station_range}</td><td class="n">${fmt(Math.max(0,p.shortfall_vs_karnataka))}</td></tr>`).join('')+'<tr><td colspan="4" style="color:#5b6475">* stations to reach Karnataka\u2019s density</td></tr>';
 document.getElementById('note').innerHTML=`<b>How supply is estimated</b> · Maharashtra\u2019s official total (4,155, PIB 2151390, 1 Aug 2025) is allocated to districts with weights BEV<sup>${s.small_area_coef_excl_mh[1]}</sup>·(open sites+1)<sup>${s.small_area_coef_excl_mh[2]}</sup>, fitted across the other 35 states. On Chhattisgarh\u2019s official district counts this beat open-share, BEV-share and 50:50 allocations (WAPE 0.41); its 90% predictive intervals covered 82% of districts. Districts with no open-data site rest entirely on the model (data-thin layer).<br><br><b>Sources</b> · BEV by RTO (VAHAN, 61 offices; Σ RTO = state total) mapped to districts by the committed crosswalk · Open data: OSM ∪ OCM ∪ Overture, linked within 150 m.<br><br><b>Boundaries</b> · geoBoundaries IND ADM2 2021 (Pathways Data / LGD, ODbL): 36 districts incl. Palghar; Mumbai City + Mumbai Suburban shown as one unit to match RTO jurisdictions. No third-party basemap. Not Survey of India–certified.`;
}
const lg=document.getElementById('layers'); LAYERS.forEach((L,i)=>lg.insertAdjacentHTML('beforeend',`<label><input type="radio" name="lyr" value="${i}" ${i?'':'checked'}> ${L.name}</label>`));
function legend(L){const lab=[`< ${fmt(L.breaks[0],1)}`,...L.breaks.slice(0,-1).map((b,i)=>`${fmt(b,1)}–${fmt(L.breaks[i+1],1)}`),`> ${fmt(L.breaks.at(-1),1)}`];
 document.getElementById('legend').innerHTML=L.colors.map((c,i)=>`<div><span class="sw" style="background:${c}"></span>${lab[i]} ${L.unit}</div>`).join('')+'<div><span class="sw" style="background:#d6dae1"></span>no data</div>';}
function expr(L){const e=['step',['coalesce',['get',L.id],-1],'#d6dae1',0,L.colors[0]];L.breaks.forEach((b,i)=>e.push(b,L.colors[i+1]));return e;}
const bounds=(()=>{let b=[180,90,-180,-90];AREAS.features.forEach(f=>{const walk=c=>typeof c[0]==='number'?(b=[Math.min(b[0],c[0]),Math.min(b[1],c[1]),Math.max(b[2],c[0]),Math.max(b[3],c[1])]):c.forEach(walk);walk(f.geometry.coordinates)});return [[b[0],b[1]],[b[2],b[3]]]})();
const map=new maplibregl.Map({container:'map',bounds,fitBoundsOptions:{padding:24},style:{version:8,sources:{},layers:[{id:'bg',type:'background',paint:{'background-color':'#eef1f5'}}]}});
map.on('load',()=>{
 map.addSource('areas',{type:'geojson',data:AREAS}); map.addSource('sites',{type:'geojson',data:SITES});
 map.addLayer({id:'fill',type:'fill',source:'areas',paint:{'fill-color':expr(LAYERS[0]),'fill-opacity':0.85}});
 map.addLayer({id:'line',type:'line',source:'areas',paint:{'line-color':'#475569','line-width':0.7}});
 map.addLayer({id:'hl',type:'line',source:'areas',paint:{'line-color':'#111827','line-width':2.4},filter:['==',['get',MODE==='national'?'shapeName':'district'],'']});
 map.addLayer({id:'pts',type:'circle',source:'sites',paint:{'circle-radius':['case',['>=',['get','n'],2],3.4,2.4],'circle-color':['case',['>=',['get','n'],2],'#0f766e','#94a3b8'],'circle-stroke-width':0.5,'circle-stroke-color':'#fff'}});
 legend(LAYERS[0]);
 document.querySelectorAll('input[name=lyr]').forEach(r=>r.onchange=e=>{const L=LAYERS[+e.target.value];map.setPaintProperty('fill','fill-color',expr(L));legend(L);});
 document.getElementById('tSites').onchange=e=>map.setLayoutProperty('pts','visibility',e.target.checked?'visible':'none');
 const tip=document.getElementById('tip'), nm=p=>MODE==='national'?p.shapeName:p.district;
 map.on('mousemove','fill',e=>{map.getCanvas().style.cursor='pointer';tip.style.display='block';tip.style.left=(e.point.x+12)+'px';tip.style.top=(e.point.y+12)+'px';tip.textContent=nm(e.features[0].properties);});
 map.on('mouseleave','fill',()=>{map.getCanvas().style.cursor='';tip.style.display='none';});
 const popup=(p,ll)=>{let h;
  if(MODE==='national') h=`<b>${p.shapeName}</b><br>BEV registered (to date): <b>${fmt(p.bev_cum)}</b><br>BEV registered in 2025: ${fmt(p.bev_2025)} (${p.bev_share_2025_pct??'—'}% of all)<br>CY2026 nowcast: ${fmt(p.nowcast_2026)} (Jan–Sep: ${fmt(p.ytd_jan_sep_2026)})<br>Official stations (Aug 2025): <b>${fmt(p.pcs_total)}</b> → <b>${fmt(p.bev_per_pcs)}</b> BEV/station<hr style="border:0;border-top:1px solid #eee">Open data: OSM ${fmt(p.n_osm)} · OCM ${fmt(p.n_ocm)} · Overture ${fmt(p.n_ovt)} → ${fmt(p.n_obs)} sites (${fmt(p.coverage_pct,1)}% of official)<br>Capture–recapture estimate: ${fmt(p.N_hat)} (90% CI ${fmt(p.ci90_lo)}–${fmt(p.ci90_hi)}) <i>not validated</i>`;
  else h=`<b>${p.district}</b><br>BEV registered (to date): <b>${fmt(p.bev_total)}</b> — 2W ${fmt(p.bev_2W)} · 3W ${fmt(p.bev_3W)} · 4W ${fmt(p.bev_4W)}<br>Registered in 2025: ${fmt(p.bev_2025)}<br>Estimated public stations: <b>${fmt(p.est_stations)}</b> (90%: ${fmt(p.est_lo)}–${fmt(p.est_hi)})<br>BEV per station: <b>${fmt(p.bev_per_station)}</b> (${p.bev_per_station_range})<br>Sites visible in open data: ${fmt(p.open_sites)}<br>Stations to reach Karnataka density: ${fmt(Math.max(0,p.shortfall_vs_karnataka))} more<hr style="border:0;border-top:1px solid #eee"><b>Why:</b> ${p.drivers}`;
  new maplibregl.Popup().setLngLat(ll).setHTML(h).addTo(map);};
 map.on('click','fill',e=>{popup(e.features[0].properties,e.lngLat);map.setFilter('hl',['==',['get',MODE==='national'?'shapeName':'district'],nm(e.features[0].properties)]);});
 map.on('click','pts',e=>{const p=e.features[0].properties;new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<b>${p.name||'(unnamed)'}</b><br>listed by: ${p.s.replace('ovt','Overture').replace('osm','OSM').replace('ocm','OCM')}`).addTo(map);});
 document.querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>{const f=AREAS.features.find(f=>f.properties.district===tr.dataset.d);if(!f)return;
  map.setFilter('hl',['==',['get','district'],tr.dataset.d]);let b=[180,90,-180,-90];const walk=c=>typeof c[0]==='number'?(b=[Math.min(b[0],c[0]),Math.min(b[1],c[1]),Math.max(b[2],c[0]),Math.max(b[3],c[1])]):c.forEach(walk);walk(f.geometry.coordinates);
  map.fitBounds([[b[0],b[1]],[b[2],b[3]]],{padding:60,maxZoom:9});popup(f.properties,[(b[0]+b[2])/2,(b[1]+b[3])/2]);});
});
</script></body></html>
