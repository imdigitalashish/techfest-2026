quotes:
  - locator: "Chapter 2, p. 78"
    quote: "The results reveal that BEV has the least life cycle GHG emissions per kilometre (in g CO2-eq./km) compared with ICEV and HEV for both body types."
notes: "Strong held-out Indian car benchmark, independent of ICCT. Most comparable to a small hatchback/compact SUV car case, not the 2W scooter case. Lifetime is 160,000 km, close to the planned ~165,000 km sedan assumption. Appendix A 2.4 gives base-case g/km at 30% coal TPP efficiency; 25/35/40% sensitivity columns are also reported for BEVs."
