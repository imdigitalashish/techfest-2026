study:
  id: iitg-vehicle-lca-india-thesis-2025-ch2
  source_id: iitg-vehicle-lca-thesis-2025
  citation: "Harshendra N. Shet K. Life Cycle Analysis (LCA) of Vehicles Powered by Clean Energy: An Indian Perspective. PhD thesis, Indian Institute of Technology Guwahati, June 2025. Chapter 2: Comparative Assessment of Global Warming Potential of Gasoline, Battery, and Hybrid Vehicles in India."
  locator: "Chapter 2, Tables 2.1, 2.15, 2.16, 2.18; Appendix A 2.1-A 2.4"
  functional_unit: "1 vehicle-km over 160,000 km lifetime"
  unit: "g CO2-eq/km; kg CO2-eq by vehicle/fuel cycle"
  boundary: "Vehicle cycle + fuel cycle (well-to-wheel); includes vehicle components, battery manufacturing, oils/fluids/adhesives, tyre/rim, ADR, WTT and TTW."
  geography: IN
  reference_year: "2022-23 present electricity mix; projected 2029-30 scenario also stated"
  gwp_note: "CO2-equivalent; table reports GWP kg CO2-eq/kWh. Specific IPCC GWP characterization set not transcribed here."
  license: "No open license stated in thesis PDF."
independent_of_icct: true
