study:
  id: teri-lca-rating-4w-india-2026
  source_id: teri-lca-rating-4w-india-2026
  citation: "Aparna Sajeev, Debesh Kumar Panda, Rumi Azim, Souvik Bhattacharjya, Sharif Qamar. Life Cycle Assessment Based Rating Framework for Four-Wheeler Passenger Vehicles. The Energy and Resources Institute (TERI), 2026."
  locator: "Executive Summary, p. 1; Table 5, pp. 54-55"
  functional_unit: "per vehicle over 150,000 km; derived g CO2e/km values use reported kg CO2e per vehicle / 150,000 km"
  unit: "kg CO2-eq per vehicle; derived g CO2-eq/km"
  boundary: "Full cradle-to-grave: material extraction, manufacturing, energy production, vehicle use, maintenance, constrained end-of-life. Results table reports material, use phase, OEM manufacturing/logistics, and total."
  geography: IN
  reference_year: "vehicles available in Indian automotive market as of March 2025; report copyright 2026"
  gwp_note: "GWP100 (IPCC AR6)."
  license: "Copyright TERI, 2026; no open license stated."
independent_of_icct: true
inputs_stated:
  lifetime_km:
    value: 150000
    unit: km
    locator: "Executive Summary, p. 1"
    quote: "Each passenger four-wheeler is assumed to operate over a total driving distance of 150,000 km"
  gwp_basis:
    value: "GWP100 IPCC AR6"
    locator: "Executive Summary, p. 1"
    quote: "Using GWP100 (IPCC AR6) as the assessment metric"
  system_boundary:
    value: "cradle-to-grave"
    locator: "Executive Summary, p. 1"
    quote: "full cradle-to-grave perspective, capturing greenhouse gas (GHG) emissions from material extraction"
  vehicle_population:
    value: "representative sample of 59 Indian 4W passenger vehicles"
    locator: "Table 5, p. 54"
    quote: "Table 5: Life cycle emission assessment of a sample of 59 4-wheeler passenger vehicles in India"
  grid_emission_factor: {status: UNVERIFIED, notes: "Not transcribed in this pass; use-phase emissions are reported directly by vehicle."}
  fuel_or_electricity_consumption: {status: UNVERIFIED, notes: "Not transcribed in this pass; use-phase emissions are reported directly by vehicle."}
  battery_capacity: {status: UNVERIFIED, notes: "Not transcribed in this pass; material-stage emissions are reported directly by vehicle."}
  battery_production_factor: {status: UNVERIFIED, notes: "Not transcribed in this pass; material-stage emissions are reported directly by vehicle."}
  vehicle_mass_or_production_factor: {status: UNVERIFIED, notes: "Material emissions are reported directly; masses/factors not transcribed in this pass."}
