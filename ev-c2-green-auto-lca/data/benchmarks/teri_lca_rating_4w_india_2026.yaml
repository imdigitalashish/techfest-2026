quotes:
  - locator: "Executive Summary, p. 1"
    quote: "The demonstration uses total life cycle GHG emissions (expressed in kg CO₂-eq per vehicle over its assumed lifetime, i.e., 1,50,000 kilometer) derived from the cradle-to-grave LCA described in earlier chapters."
notes: "Strong held-out Indian car benchmark because it is non-ICCT, India-specific, and reports stage-by-stage kg CO2e for many current petrol/diesel/CNG/BEV passenger cars. Comparable to the planned Indian sedan case after converting to g/km, but lifetime is 150,000 km, not ~165,000 km. Not useful for 2W scooter validation. Some key inventory assumptions were not transcribed in this pass and are marked UNVERIFIED."
