# Materials layer — steel (spike D groundwork). Thresholds from the Government of India Green Steel Taxonomy (2024).
# They are policy thresholds, not measured intensities: use them only as labelled bands until plant/product data are found.
- id: method.steel.green_threshold.in.mos2024
  layer: method
  name: Green-steel eligibility threshold (India Green Steel Taxonomy) — emission intensity of finished steel
  value: 2.2
  unit: t CO2e/t finished steel
  quantity: emission_factor
  gas_basis: CO2e-unspecified
  boundary: "Scope 1 + 2 + limited scope 3 (agglomeration incl. sintering, pelletising, coke making; beneficiation; embodied emissions of purchased raw materials and intermediates) up to finished steel; excludes upstream mining, downstream and transport."
  geography: IN
  reference_year: "2024"
  technology: any steelmaking route (plant-level MRV by NISST under BEE CCTS procedure)
  source_id: mos-green-steel-taxonomy-2024
  locator: "Notification dated 23 Dec 2024 (Gazette Extraordinary No. 342, 24 Dec 2024), clause 1, PDF p. 4"
  quote: "plant with CO2 equivalent emission intensity less than 2.2 tonnes of CO 2e per tonne of finished steel (tfs)"
  accessed: 2026-10-04
  pedigree: {reliability: 1, completeness: 1, temporal: 1, geographical: 1, technological: 3, rationale: "Official threshold; not a measured intensity of any plant or route"}
  status: verified
