  notes: "Opened PDF: notification dated 23 Dec 2024 (F. No. 1(6)-2024-ID-2), Gazette of India Extraordinary Part I Sec. 1 No. 342 of Tue 24 Dec 2024, gazette ID CG-DL-E-26122024-259635, digitally signed 26 Dec 2024. The steel.gov.in taxonomy page (opened 4 Oct 2026) says the taxonomy was released on 12.12.2024 and notified in eGazette on 23.12.2024. Thresholds in t CO2e per tonne of finished steel (tfs); scope 1 + 2 + limited scope 3; NISST is the MRV and certification agency; MRV per BEE CCTS procedure (July 2024)."
